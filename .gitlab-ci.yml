# Keep security reports available on merge requests with independent scanner jobs.
stages: [lint, test, security, eval]
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
variables:
  AST_ENABLE_MR_PIPELINES: "true"
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
default:
  image: python:3.11-slim
lint:
  stage: lint
  script:
    - pip install '.[dev]'
    - ruff check .
    - ruff format --check .
unit-tests:
  stage: test
  script:
    - pip install '.[dev]'
    - python -m pytest --cov=mr_sentinel --cov-fail-under=85 --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report: {coverage_format: cobertura, path: coverage.xml}
sast:
  stage: security
secret_detection:
  stage: security
trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.61.1
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,misconfig,secret --exit-code 1 --severity HIGH,CRITICAL .
pip-audit:
  stage: security
  script:
    - pip install . pip-audit==2.9.0
    - pip-audit --local --strict
eval-gate:
  stage: eval
  script:
    - pip install .
    - python evals/run_eval.py --fixture --fail-if-f1-below 0.75 --output runs/smoke.json
  artifacts:
    paths: [runs/smoke.json]
